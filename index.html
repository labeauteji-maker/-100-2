<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 펀드투자권유자문인력 실전 모의고사 (100문항 에디토리얼 에디션)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-paper: #F7F5F0;
    --bg-card: #FFFFFF;
    --bg-sub: #F2EFE9;
    --text-ink: #1C1B18;
    --text-muted: #5C5952;
    --border-hairline: #E2DDD2;
    --accent-primary: #1E3A2F;
    --accent-primary-soft: #EBF2EE;
    --success: #1B6B46;
    --success-bg: #EDF7F2;
    --danger: #A62C2B;
    --danger-bg: #FDF0F0;
    --gold: #8C6D2E;
    --gold-bg: #FAF5EA;
    --shadow-card: 0 10px 30px -10px rgba(28, 27, 24, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background-color: var(--bg-paper);
    color: var(--text-ink);
    line-height: 1.65;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 상단 헤더 */
  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-hairline);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 820px;
    margin: 0 auto;
  }

  /* 상단 접기/펼치기 바 */
  .collapse-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border-hairline);
  }

  .collapse-bar.collapsed-only {
    padding-bottom: 0;
    margin-bottom: 0;
    border-bottom: none;
  }

  .mini-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn-toggle-header {
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border-hairline);
    background: var(--bg-paper);
    color: var(--accent-primary);
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .btn-toggle-header:hover {
    background: var(--bg-sub);
  }

  .header-collapsible.is-collapsed {
    display: none;
  }


  .top-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .brand h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-ink);
    letter-spacing: -0.02em;
  }

  .brand p {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn-sm {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-hairline);
    background: var(--bg-card);
    color: var(--text-ink);
    transition: all 0.15s;
  }

  .btn-sm:hover {
    background: var(--bg-sub);
  }

  .btn-sm.primary {
    background: var(--accent-primary);
    color: #fff;
    border-color: var(--accent-primary);
  }

  .btn-sm.primary:hover {
    opacity: 0.92;
  }

  /* 과목 & 모드 필터 탭 */
  .nav-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: space-between;
  }

  .tab-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tab-btn {
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-hairline);
    background: var(--bg-paper);
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .tab-btn:hover {
    border-color: var(--accent-primary);
    color: var(--text-ink);
  }

  .tab-btn.active {
    background: var(--accent-primary);
    color: #FFFFFF;
    border-color: var(--accent-primary);
  }

  .tab-btn.wrong-tab.active {
    background: var(--danger);
    border-color: var(--danger);
  }

  .wrong-badge {
    display: inline-block;
    background: rgba(166, 44, 43, 0.12);
    color: var(--danger);
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 0.75rem;
    margin-left: 4px;
  }

  .tab-btn.wrong-tab.active .wrong-badge {
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
  }

  .jump-select {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-hairline);
    background: var(--bg-card);
    color: var(--text-ink);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* 프로그레스 바 */
  .progress-wrap {
    max-width: 820px;
    margin: 12px auto 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-track {
    flex: 1;
    height: 5px;
    background: var(--border-hairline);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent-primary);
    transition: width 0.25s ease;
  }

  .progress-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* 메인 컨테이너 */
  main {
    flex: 1;
    width: 100%;
    max-width: 820px;
    margin: 28px auto 48px;
    padding: 0 20px;
  }

  /* 성적표 모달/패널 */
  .score-panel {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-hairline);
    border-left: 5px solid var(--accent-primary);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-card);
  }

  .score-panel.show { display: block; }

  .score-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .score-header h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.15rem;
  }

  .score-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
  }

  .score-item {
    background: var(--bg-paper);
    border: 1px solid var(--border-hairline);
    border-radius: 10px;
    padding: 14px;
  }

  .score-item span {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .score-item strong {
    font-size: 1.25rem;
  }

  .pass-txt { color: var(--success); }
  .fail-txt { color: var(--danger); }

  /* 단일 문제 카드 */
  .flashcard {
    background: var(--bg-card);
    border: 1px solid var(--border-hairline);
    border-radius: 16px;
    padding: 32px 30px;
    box-shadow: var(--shadow-card);
    transition: border-color 0.2s ease;
  }

  .flashcard.state-correct { border-color: var(--success); }
  .flashcard.state-wrong { border-color: var(--danger); }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-hairline);
  }

  .subj-tag {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--accent-primary);
    background: var(--accent-primary-soft);
    padding: 4px 12px;
    border-radius: 999px;
  }

  .q-counter {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-muted);
  }

  .q-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.18rem;
    font-weight: 700;
    line-height: 1.6;
    color: var(--text-ink);
    margin-bottom: 20px;
    word-break: keep-all;
  }

  .q-box {
    background: var(--bg-sub);
    border: 1px solid var(--border-hairline);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.93rem;
    color: var(--text-ink);
    line-height: 1.65;
  }

  /* 선지 리스트 */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .opt-btn {
    width: 100%;
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid var(--border-hairline);
    background: var(--bg-card);
    color: var(--text-ink);
    font-size: 0.97rem;
    font-weight: 500;
    line-height: 1.55;
    cursor: pointer;
    transition: all 0.15s ease;
    word-break: keep-all;
  }

  .opt-btn:hover:not(.locked) {
    background: var(--bg-paper);
    border-color: var(--accent-primary);
    transform: translateY(-1px);
  }

  .opt-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg-sub);
    color: var(--text-muted);
    font-size: 0.82rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .opt-btn.correct-choice {
    background: var(--success-bg);
    border-color: var(--success);
    color: #12472E;
    font-weight: 600;
  }

  .opt-btn.correct-choice .opt-num {
    background: var(--success);
    color: #fff;
  }

  .opt-btn.wrong-choice {
    background: var(--danger-bg);
    border-color: var(--danger);
    color: #7A1E1D;
  }

  .opt-btn.wrong-choice .opt-num {
    background: var(--danger);
    color: #fff;
  }

  /* 해설 슬라이드 드로어 */
  .explanation-drawer {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.35s ease, opacity 0.25s ease, margin-top 0.25s ease;
  }

  .explanation-drawer.open {
    max-height: 600px;
    opacity: 1;
    margin-top: 24px;
  }

  .exp-inner {
    background: var(--bg-paper);
    border: 1px solid var(--border-hairline);
    border-left: 4px solid var(--accent-primary);
    border-radius: 10px;
    padding: 18px 20px;
  }

  .exp-inner.is-wrong {
    border-left-color: var(--danger);
  }

  .exp-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .exp-verdict {
    font-size: 0.95rem;
    font-weight: 700;
  }

  .exp-verdict.ok { color: var(--success); }
  .exp-verdict.no { color: var(--danger); }

  .btn-mastered {
    padding: 5px 11px;
    border-radius: 6px;
    border: 1px solid var(--success);
    background: var(--success-bg);
    color: var(--success);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-mastered:hover {
    background: var(--success);
    color: #fff;
  }

  .exp-body {
    font-size: 0.94rem;
    color: var(--text-ink);
    line-height: 1.7;
    word-break: keep-all;
  }

  .exp-body strong {
    color: var(--accent-primary);
    background: var(--gold-bg);
    padding: 1px 4px;
    border-radius: 4px;
  }

  /* 하단 네비게이션 컨트롤 */
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 12px;
  }

  .nav-btn {
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border-hairline);
    background: var(--bg-card);
    color: var(--text-ink);
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .nav-btn:hover:not(:disabled) {
    background: var(--bg-sub);
    border-color: var(--text-muted);
  }

  .nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .nav-btn.next {
    background: var(--accent-primary);
    color: #fff;
    border-color: var(--accent-primary);
  }

  .nav-btn.next:hover:not(:disabled) {
    opacity: 0.92;
  }

  .shortcut-hint {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 16px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
  }

  .empty-state h3 {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.15rem;
    margin-bottom: 8px;
  }

  .empty-state p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }

  @media (max-width: 600px) {
    .flashcard { padding: 22px 18px; }
    .q-text { font-size: 1.06rem; }
    .opt-btn { padding: 12px 14px; font-size: 0.92rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="collapse-bar" id="collapse-bar">
      <span class="mini-title">2026 펀드투자권유자문인력 실전 모의고사</span>
      <button type="button" class="btn-toggle-header" id="btn-toggle-header" onclick="toggleHeaderPanel()" aria-expanded="true">상단 메뉴 접기 ▲</button>
    </div>
    <div class="header-collapsible" id="header-collapsible">
    <div class="top-row">
      <div class="brand">
        <h1>2026 펀드투자권유자문인력 실전 모의고사</h1>
        <p>전체 100문항 수록 · 한 문제씩 집중 풀이 & 자동 오답노트</p>
      </div>
      <div class="header-actions">
        <button class="btn-sm primary" onclick="showScoreSummary()">성적표 보기</button>
        <button class="btn-sm" onclick="resetAllData()">전체 초기화</button>
      </div>
    </div>

    <div class="nav-tabs">
      <div class="tab-group">
        <button class="tab-btn active" data-filter="all" onclick="setFilter('all')">전체 (100)</button>
        <button class="tab-btn" data-filter="1" onclick="setFilter('1')">1과목 펀드일반 (60)</button>
        <button class="tab-btn" data-filter="2" onclick="setFilter('2')">2과목 파생상품 (25)</button>
        <button class="tab-btn" data-filter="3" onclick="setFilter('3')">3과목 부동산 (15)</button>
        <button class="tab-btn wrong-tab" data-filter="wrong" onclick="setFilter('wrong')">
          오답만 다시풀기 <span class="wrong-badge" id="wrong-count">0</span>
        </button>
      </div>

      <select class="jump-select" id="jump-select" onchange="jumpToIndex(this.value)" title="문항 번호 바로가기"></select>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label">풀이 완료 0 / 100문항</div>
    </div>
    </div>
  </div>
</header>

<main>
  <div class="score-panel" id="score-panel">
    <div class="score-header">
      <h2 id="score-title">실전 모의고사 성적 요약</h2>
      <button class="btn-sm" onclick="document.getElementById('score-panel').classList.remove('show')">닫기</button>
    </div>
    <div class="score-grid" id="score-grid"></div>
  </div>

  <div id="card-mount"></div>

  <div class="card-footer" id="card-footer">
    <button class="nav-btn" id="btn-prev" onclick="moveCard(-1)">← 이전 문제</button>
    <button class="btn-sm" id="btn-retry-single" onclick="retryCurrentQuestion()" style="display:none;">이 문제 다시 풀기</button>
    <button class="nav-btn next" id="btn-next" onclick="moveCard(1)">다음 문제 →</button>
  </div>

  <div class="shortcut-hint">
    단축키 안내: 키보드 <strong>1 ~ 4</strong>번으로 답안 선택 · <strong>← / →</strong> 방향키로 이전·다음 문제 이동
  </div>
</main>

<script>
const questions = [
  // 제1과목: 펀드일반 (1~60)
  { id: 1, subj: 1, q: "자본시장법상 집합투자의 개념요소에 해당하지 않는 것은?", opts: ["2인 이상의 자에게 투자권유를 할 것", "투자자로부터 모은 금전 등을 집합하여 운용할 것", "투자자로부터 일상적인 운용지시를 받아 운용할 것", "운용결과를 투자자에게 배분하여 귀속시킬 것"], ans: 3, exp: "집합투자는 투자자로부터 <strong>일상적인 운용지시를 받지 않고</strong> 운용해야 합니다." },
  { id: 2, subj: 1, q: "자본시장법상 인정되는 집합투자기구의 법적 형태가 아닌 것은?", opts: ["투자신탁", "투자합명회사", "투자유한책임회사", "투자익명조합"], ans: 2, exp: "자본시장법상 집합투자기구 7종(투자신탁, 투자회사, 투자유한회사, 투자합자회사, 투자유한책임회사, 투자합자조합, 투자익명조합)에 <strong>합명회사 형태는 인정되지 않습니다</strong>." },
  { id: 3, subj: 1, q: "자본시장법상 투자회사에 대한 설명으로 가장 거리가 먼 것은?", opts: ["상법상 주식회사 형태이나 서류상 회사(Paper Company)로 본점 외 영업소를 둘 수 없다.", "집합투자업자가 법인이사가 되어 업무를 집행한다.", "감독이사는 1인 이상 두어야 하며 법인이사의 업무집행을 감독한다.", "법인이사는 3개월마다 1회 이상 업무집행상황 및 자산운용내역을 이사회에 보고해야 한다."], ans: 3, exp: "투자회사의 감독이사는 <strong>2인 이상</strong>이어야 합니다(법인이사 1인, 감독이사 2인 이상)." },
  { id: 4, subj: 1, q: "투자신탁의 수익자총회에 대한 설명으로 바르지 못한 것은?", opts: ["집합투자업자가 소집하는 것이 원칙이나, 신탁업자 또는 발행된 수익증권 총좌수의 5% 이상을 보유한 수익자도 소집을 청구할 수 있다.", "출석한 수익자의 의결권의 과반수와 발행된 수익증권 총좌수의 4분의 1 이상의 찬성으로 결의한다.", "수익자총회의 결의가 이루어지지 않은 경우 그날부터 2주 이내에 연기수익자총회를 소집하여야 한다.", "합병결의에 반대하는 수익자는 총회결의일로부터 30일 이내에 자신의 수익증권을 매수할 것을 청구할 수 있다."], ans: 4, exp: "반대수익자의 수익증권 매수청구권 행사기간은 총회결의일로부터 <strong>20일 이내</strong>입니다." },
  { id: 5, subj: 1, q: "자본시장법상 집합투자업자가 수익자총회의 의결을 거쳐야 하는 신탁계약 변경사항으로 가장 거리가 먼 것은?", opts: ["일반사무관리회사의 변경", "집합투자업자가 받는 보수의 인상", "주된 투자대상자산의 변경", "환매대금 지급일의 연장"], ans: 1, exp: "일반사무관리회사의 변경은 수익자총회 의결사항이 아닙니다." },
  { id: 6, subj: 1, q: "집합투자기구의 증권신고서 및 투자설명서에 관한 설명으로 옳은 것은?", opts: ["투자신탁의 수익증권과 투자회사의 주식은 액면식·무기명식으로 발행된다.", "전문투자자에게 집합투자증권을 취득하게 하는 경우에도 반드시 투자설명서를 교부해야 한다.", "개방형 집합투자기구는 최초 투자설명서 제출 후 매년 1회 이상 정기적으로 투자설명서를 갱신해야 한다.", "간이투자설명서는 증권신고서의 효력발생 전에는 사용할 수 없다."], ans: 3, exp: "① 무액면·기명식 발행, ② 전문투자자는 교부 면제, ④ 간이투자설명서는 증권신고서 효력발생 전·후 모두 사용 가능합니다." },
  { id: 7, subj: 1, q: "집합투자증권의 판매수수료와 판매보수에 대한 설명으로 바르지 못한 것은?", opts: ["판매수수료는 투자자로부터 직접 받으며, 납입금액 또는 환매금액의 100분의 2를 초과할 수 없다.", "판매보수는 집합투자기구로부터 받으며, 원칙적으로 집합투자재산 연평균가액의 100분의 1 이내여야 한다.", "이연판매보수는 집합투자재산 연평균가액의 100분의 1.5를 초과할 수 없다.", "판매수수료와 판매보수는 사모집합투자기구에도 동일한 상한 규제가 적용된다."], ans: 4, exp: "판매수수료(2%)와 판매보수(1%) 상한 규제는 공모펀드에만 적용되며 <strong>사모펀드에는 적용되지 않습니다</strong>." },
  { id: 8, subj: 1, q: "자본시장법상 집합투자증권의 환매에 대한 설명으로 가장 거리가 먼 것은?", opts: ["환매가격은 원칙적으로 환매청구일 이후에 산정되는 기준가격으로 한다.", "환매대금은 원칙적으로 환매청구일부터 15일 이내에 지급하여야 한다.", "집합투자기구의 투자자 전원의 동의를 얻은 경우 집합투자재산으로 환매대금을 지급할 수 있다.", "환매수수료는 환매금액 또는 이익금을 기준으로 부과하며, 해당 집합투자업자에 귀속된다."], ans: 4, exp: "환매수수료는 집합투자업자가 아닌 <strong>해당 집합투자재산(펀드)에 귀속</strong>됩니다." },
  { id: 9, subj: 1, q: "공모집합투자기구에서 동일종목 증권임에도 불구하고 집합투자재산 자산총액의 100%까지 투자할 수 있는 증권으로 가장 거리가 먼 것은?", opts: ["국채증권", "한국은행통화안정증권", "정부가 원리금의 지급을 보증한 채권", "경제협력개발기구(OECD) 회원국가가 발행한 채권"], ans: 4, exp: "OECD 회원국 발행 채권, 지방채, 특수채, 파생결합증권은 자산총액의 <strong>30%까지</strong> 투자 가능합니다." },
  { id: 10, subj: 1, q: "집합투자업자의 자산운용제한에 관한 설명으로 바르지 못한 것은?", opts: ["국내 소재 부동산을 취득한 경우 취득 후 1년 이내에 처분하는 행위는 금지된다.", "각 집합투자기구에 속하는 증권의 50%를 초과하여 증권을 대여할 수 없다.", "증권의 차입은 각 집합투자기구 자산총액의 20%를 초과할 수 없다.", "환매 대량청구 등 일시적 자금부족 시 차입하는 금전 총액은 차입 당시 집합투자재산 총액의 20%를 초과할 수 없다."], ans: 4, exp: "환매 대량청구 등 일시적 자금부족 시 금전차입 한도는 차입 당시 집합투자재산 총액의 <strong>10%</strong>입니다." },
  { id: 11, subj: 1, q: "자본시장법상 이해관계인과의 거래가 예외적으로 허용되는 경우가 아닌 것은?", opts: ["이해관계인이 되기 1개월 이전에 체결한 계약에 따른 거래", "증권시장 등 불특정다수인이 참여하는 공개시장을 통한 거래", "일반적인 거래조건에 비추어 집합투자기구에 유리한 거래", "이해관계인인 신탁업자와의 외국환거래법에 따른 외국통화의 매매"], ans: 1, exp: "이해관계인이 되기 <strong>6개월 이전</strong>에 체결한 계약에 따른 거래만 예외적으로 허용됩니다." },
  { id: 12, subj: 1, q: "공모집합투자기구의 집합투자업자가 성과보수를 받기 위한 요건으로 바르지 못한 것은?", opts: ["성과보수의 상한을 정할 것", "운용성과가 기준지표의 성과보다 낮은 경우, 성과보수를 적용하지 않는 경우보다 높은 운용보수를 받도록 보수체계를 갖출 것", "환매금지형 집합투자기구인 경우 최소 존속기한이 1년 이상일 것", "운용성과가 기준지표를 초과하더라도 해당 운용성과가 부(-)의 수익률을 나타내는 경우 성과보수를 받지 않을 것"], ans: 2, exp: "성과가 기준지표보다 낮을 경우 성과보수를 적용하지 않는 경우보다 <strong>적은 운용보수</strong>를 받도록 설계해야 합니다." },
  { id: 13, subj: 1, q: "자산운용보고서에 대한 설명으로 바르지 못한 것은?", opts: ["집합투자업자는 3개월마다 1회 이상 자산운용보고서를 작성하여 신탁업자의 확인을 받아야 한다.", "기준일로부터 2개월 이내에 판매회사를 통하여 투자자에게 교부하여야 한다.", "투자자의 동의가 있는 경우 전자우편을 이용하여 교부할 수 있다.", "자산운용보고서의 작성 및 교부에 드는 비용은 판매회사가 부담한다."], ans: 4, exp: "자산운용보고서 작성·교부 비용은 <strong>집합투자업자</strong>가 부담합니다." },
  { id: 14, subj: 1, q: "단기금융집합투자기구(MMF)의 운용제한에 관한 설명으로 바르지 못한 것은?", opts: ["잔존만기 6개월 이내인 양도성예금증서(CD)에 투자할 수 있다.", "개인용 MMF의 집합투자재산 가중평균 잔존만기는 75일 이내여야 한다.", "증권을 대여하거나 차입하는 방법으로 자산을 운용할 수 없다.", "잔존만기 1년 이상인 국채증권에 집합투자재산의 10% 이내에서 운용할 수 있다."], ans: 4, exp: "MMF에서 잔존만기 1년 이상인 국채증권은 집합투자재산의 <strong>5% 이내</strong>에서만 운용할 수 있습니다." },
  { id: 15, subj: 1, q: "외화 MMF에 대한 설명으로 가장 거리가 먼 것은?", opts: ["OECD 가입국 통화 및 중국 통화(위안화)로 운용할 수 있다.", "하나의 외화 MMF에서 여러 외화 단기금융상품을 혼합하여 투자할 수 있다.", "신규 설정요건은 개인용 1,500억원 이상, 법인용 2,500억원 이상이다.", "하나의 MMF에서 원화 단기금융상품과 외화 단기금융상품을 함께 투자할 수 없다."], ans: 2, exp: "외화 MMF는 <strong>각 MMF별 단일 통화</strong>로만 운용해야 합니다(복수 통화 혼합 불가)." },
  { id: 16, subj: 1, q: "환매금지형 집합투자기구에 대한 설명으로 바르지 못한 것은?", opts: ["부동산펀드, 특별자산펀드, 혼합자산펀드는 원칙적으로 환매금지형으로 설정·설립해야 한다.", "집합투자재산 총액의 20%를 초과하여 시장성 없는 자산에 투자하는 경우 환매금지형으로 설정해야 한다.", "집합투자증권을 최초로 발행한 날부터 90일 이내에 증권시장에 상장하여야 한다.", "원칙적으로 산정된 기준가격을 매일 공고·게시하여야 한다."], ans: 4, exp: "환매금지형 집합투자기구는 원칙적으로 <strong>기준가격 산정 및 공고·게시 의무가 배제</strong>됩니다." },
  { id: 17, subj: 1, q: "특수한 형태의 집합투자기구에 대한 설명으로 옳은 것은?", opts: ["종류형 집합투자기구는 집합투자업자 보수를 클래스별로 차별화할 수 있다.", "전환형 집합투자기구에서 다른 집합투자기구로의 전환 시 전환수수료를 징구해야 한다.", "모자형 집합투자기구에서 투자자가 직접 매수하는 펀드는 자집합투자기구이다.", "상장지수집합투자기구(ETF)는 설정일로부터 90일 이내에 상장하여야 한다."], ans: 3, exp: "① 판매보수만 클래스별 차등 가능, ② 전환형은 수수료 없이 전환, ④ ETF는 <strong>30일 이내</strong> 상장 의무가 있습니다." },
  { id: 18, subj: 1, q: "최근 도입된 공모펀드 상장클래스(X클래스) 제도에 대한 설명으로 바르지 못한 것은?", opts: ["일반 공모펀드에 상장클래스를 신설하여 한국거래소에서 주식이나 ETF처럼 장내 매매할 수 있도록 한 제도이다.", "판매수수료 및 판매보수 절감을 통해 공모펀드의 경쟁력을 제고하기 위해 도입되었다.", "지정참가회사(AP)를 통해서만 설정 및 환매가 가능하다.", "상장클래스를 매수한 투자자는 언제든지 일반 오프라인 클래스나 온라인 클래스로 재전환할 수 있다."], ans: 4, exp: "공모펀드 상장클래스(X클래스)는 장내 매매 상품으로, <strong>다른 클래스로 재전환할 수 없습니다</strong>." },
  { id: 19, subj: 1, q: "투자신탁의 법정해지 사유에 해당하지 않는 것은?", opts: ["신탁계약에서 정한 신탁계약기간의 종료", "수익자총회의 투자신탁 해지 결의", "수익자 전원의 동의", "투자신탁의 피흡수합병"], ans: 3, exp: "수익자 전원의 동의 및 수익증권 전부의 환매청구는 <strong>임의해지</strong> 사유입니다." },
  { id: 20, subj: 1, q: "공모·개방형 투자신탁을 집합투자업자가 금융위원회의 승인을 받지 않고 임의해지할 수 있는 소규모펀드 기준으로 옳은 것은?", opts: ["설정 후 6개월이 되는 날 원본액이 50억원 미만인 경우", "설정 후 1년이 되는 날 원본액이 50억원 미만인 경우", "설정 후 1년이 지난 후 1개월간 계속하여 원본액이 100억원에 미달하는 경우", "설정 후 2년이 되는 날 원본액이 100억원 미만인 경우"], ans: 2, exp: "공모·개방형 펀드 설정 후 <strong>1년이 되는 날 원본액이 50억원 미만</strong>이거나, 1년 이후 1개월간 계속 50억원 미달 시 임의해지할 수 있습니다." },
  { id: 21, subj: 1, q: "금융소비자보호에 관한 법률(금소법)상 6대 판매원칙에 대한 설명으로 바르지 못한 것은?", opts: ["적합성 원칙은 일반금융소비자에게만 적용되며, 예금성 상품에는 적용되지 않는다.", "적정성 원칙은 일반금융소비자에게 권유 없이 파생상품 등을 판매할 때 적용되며, 일반 인덱스펀드는 제외된다.", "설명의무 위반 시 고의·과실에 대한 입증책임은 금융소비자에게 있다.", "광고규제에 따라 판매대리·중개업자는 금융상품에 관한 광고를 할 수 없다."], ans: 3, exp: "금소법상 설명의무 위반으로 인한 손해배상청구 시 고의·과실에 대한 <strong>입증책임은 금융회사</strong>로 전환되었습니다." },
  { id: 22, subj: 1, q: "금소법상 금융소비자 권익강화제도에 대한 설명으로 바르지 못한 것은?", opts: ["투자성 상품의 청약철회권 행사기간은 계약체결일로부터 7일 이내이다.", "청약철회 접수 시 금융회사는 3영업일 이내에 받은 금전 등을 반환하여야 한다.", "위법계약해지권은 계약체결일로부터 5년 이내, 위법사실을 안 날로부터 1년 이내에 행사할 수 있다.", "위법계약해지권이 행사되어 계약이 해지되면 계약 체결 시점으로 소급하여 무효가 된다."], ans: 4, exp: "위법계약해지권 행사 시 계약은 해지 시점부터 <strong>장래를 향해 효력을 상실</strong>합니다(소급 무효 및 원상회복의무 없음)." },
  { id: 23, subj: 1, q: "금소법상 판매원칙 위반 시 부과되는 제재로 옳지 않은 것은?", opts: ["설명의무 위반 시 관련 거래로 얻은 수입 등의 50% 이내에서 징벌적 과징금이 부과될 수 있다.", "적합성 원칙 및 적정성 원칙 위반 시에도 수입 등의 50% 이내에서 징벌적 과징금이 부과된다.", "불공정영업행위 및 부당권유행위 금지 위반 시 1억원 이하의 과태료가 부과된다.", "적합성 원칙 위반 시 3천만원 이하의 과태료가 부과된다."], ans: 2, exp: "<strong>적합성 원칙 및 적정성 원칙 위반은 징벌적 과징금 부과 대상에서 제외</strong>됩니다(과태료 3천만원만 부과)." },
  { id: 24, subj: 1, q: "자본시장법상 고난도금융투자상품 판매 및 65세 이상 고령투자자 보호장치에 대한 설명으로 옳은 것은?", opts: ["65세 이상 고령투자자에게 고난도금융투자상품을 판매할 때 판매과정을 녹취하고 2영업일 이상의 숙려기간을 부여해야 한다.", "숙려기간 동안 투자자가 청약 철회 의사를 밝히지 않으면 자동으로 청약이 확정된다.", "숙려기간 부여 대상에서 부적합 투자자는 제외된다.", "고난도금융투자상품은 최대 원금손실 가능금액이 원금의 10%를 초과하는 금융투자상품을 말한다."], ans: 1, exp: "② 숙려기간 동안 투자자가 청약 확정 의사를 표시해야 계약이 체결됩니다. ④ 고난도상품은 최대 원금손실 가능금액이 <strong>20%를 초과</strong>하는 상품입니다." },
  { id: 25, subj: 1, q: "상품 판매 이후 단계의 금융소비자보호 제도에 대한 설명으로 바르지 못한 것은?", opts: ["해피콜 제도는 상품 가입 후 7영업일 이내에 판매직원이 아닌 제3자가 전화로 불완전판매 여부를 확인하는 제도이다.", "계약서류 등 금융거래 관련 자료는 원칙적으로 10년간 기록·유지·관리하여야 한다.", "내부통제기준 관련 자료는 5년간 보존하여야 한다.", "금융소비자의 자료열람요구 시 금융회사는 어떠한 경우에도 열람을 연기하거나 제한할 수 없다."], ans: 4, exp: "자료열람 요구 시 법령상 정당한 사유(영업비밀 침해 등)가 있는 경우 사유를 명기하여 연기·제한할 수 있습니다." },
  { id: 26, subj: 1, q: "금융투자업 종사자의 이해상충 방지체계에 대한 설명으로 바르지 못한 것은?", opts: ["이해상충 발생 가능성이 있는 경우 이를 고객에게 알리고, 발생 가능성을 낮춘 후, 낮추기 곤란하면 거래를 중단해야 한다.", "고객의 이익과 회사의 이익이 상충할 경우 고객의 이익이 우선한다.", "회사의 이익과 임직원의 이익이 상충할 경우 임직원의 이익이 우선한다.", "공개시장을 통한 거래를 제외하고는 원칙적으로 자기거래가 금지된다."], ans: 3, exp: "이해상충 우선순위는 <strong>고객 > 회사 > 임직원</strong> 순입니다." },
  { id: 27, subj: 1, q: "자본시장법상 정보교류차단벽(Chinese Wall) 설치 시 원칙적으로 금지되는 행위가 아닌 것은?", opts: ["정보교류차단 대상 정보의 제공 행위", "사무공간의 출입문을 공동으로 이용하는 행위", "매매정보 전산자료가 공유되도록 전산설비를 공동 이용하는 행위", "대표이사 및 감사를 겸직하게 하는 행위"], ans: 4, exp: "<strong>대표이사, 감사 및 사외이사가 아닌 감사위원회 위원</strong>은 겸직 금지 대상에서 제외됩니다." },
  { id: 28, subj: 1, q: "금융투자회사의 직무윤리 및 재산상 이익 제공·수령에 관한 설명으로 바르지 못한 것은?", opts: ["문화활동 목적의 공연관람권이나 상품권은 법인의 고유재산관리업무 수행자에게 제공할 수 있다.", "거래상대방에게 제공한 재산상 이익이 10억원을 초과하는 경우 즉시 인터넷 홈페이지를 통해 공시해야 한다.", "임직원의 사외 온라인 대화방이나 SNS 참여는 사적 영역이므로 윤리기준이 적용되지 않는다.", "고용계약이 종료된 이후에도 회사의 비밀정보에 대한 유지 의무 및 선관주의의무는 일정 기간 지속된다."], ans: 3, exp: "임직원의 온라인 커뮤니티, SNS, 사외 대화방 참여 역시 공중포럼으로 간주되어 직무윤리 및 준법절차가 적용됩니다." },
  { id: 29, subj: 1, q: "금융회사 지배구조법에 따른 준법감시인 및 내부통제위원회에 대한 설명으로 바르지 못한 것은?", opts: ["준법감시인은 이사회 의결로 임면하며, 해임 시에는 이사 총수의 3분의 2 이상의 찬성이 필요하다.", "준법감시인의 임기는 2년 이상으로 하여야 하며, 임원급에서 선임해야 한다.", "내부통제위원회의 위원장은 준법감시인이 맡으며, 매 반기 1회 이상 회의를 개최해야 한다.", "내부통제기준을 제정하거나 변경하려는 경우에는 이사회의 의결을 거쳐야 한다."], ans: 3, exp: "내부통제위원회의 위원장은 준법감시인이 아니라 <strong>대표이사</strong>입니다." },
  { id: 30, subj: 1, q: "개정 금융회사 지배구조법에 따라 도입된 '책무구조도(Responsibilities Map)'에 대한 설명으로 바르지 못한 것은?", opts: ["임원별로 내부통제 책임(책무)을 사전에 기재한 문서를 이사회 의결 후 금융당국에 제출하는 제도이다.", "최종 책임자를 특정하여 내부통제 책임의 하부 위임을 방지하는 것을 목적으로 한다.", "대표이사에게는 회사의 내부통제 총괄 관리의무가 부여된다.", "모든 금융회사는 규모와 업권에 관계없이 동일한 날짜에 일괄적으로 책무구조도를 제출해야 한다."], ans: 4, exp: "책무구조도는 금융지주·은행 → 대형 금투·보험 → 중소형 금투 등 <strong>업권·규모별 단계적 제출</strong>이 적용됩니다." },
  { id: 31, subj: 1, q: "영업점 내부통제를 위한 '영업관리자'에 대한 설명으로 가장 거리가 먼 것은?", opts: ["영업점 또는 감사업무 근무경력이 1년 이상인 자로 선임해야 한다.", "영업점장이 아닌 책임자급 직원으로 임명하며, 2개 이상의 영업점을 관리할 수 있다.", "영업관리자의 임기는 1년 이상으로 하며, 연 1회 이상 법규 및 윤리 교육을 이수해야 한다.", "영업관리자에게는 업무수행 결과에 따른 어떠한 보상도 지급할 수 없다."], ans: 4, exp: "영업점 영업관리자에게는 업무수행 결과에 따른 <strong>적절한 보상을 지급할 수 있습니다</strong>." },
  { id: 32, subj: 1, q: "개인정보보호법에 따른 개인정보 처리 원칙으로 바르지 못한 것은?", opts: ["개인정보처리자는 목적에 필요한 최소한의 개인정보만 수집해야 하며, 이에 대한 입증책임은 정보주체가 부담한다.", "정보주체가 최소한의 정보 외 개인정보 수집에 동의하지 않는다는 이유로 서비스 제공을 거부할 수 없다.", "주민등록번호는 정보주체의 동의가 있더라도 법령상 근거 등 예외 사유가 없으면 처리할 수 없다.", "고의 또는 중대한 과실로 개인정보가 유출된 경우 손해액의 최대 5배까지 징벌적 손해배상책임을 질 수 있다."], ans: 1, exp: "최소한의 개인정보 수집에 대한 <strong>입증책임은 개인정보처리자</strong>가 부담합니다." },
  { id: 33, subj: 1, q: "금융감독원 금융분쟁조정제도에 대한 설명으로 바르지 못한 것은?", opts: ["금융감독원장은 분쟁조정 신청을 받은 날로부터 30일 이내에 합의가 이루어지지 않으면 조정위원회에 회부해야 한다.", "조정위원회는 회부받은 날로부터 60일 이내에 조정안을 작성하여야 한다.", "당사자가 조정안을 수락한 경우 해당 조정안은 민법상 화해와 동일한 효력을 갖는다.", "일반금융소비자가 신청한 2천만원 이하 소액사건의 경우 금융회사는 조정안 제시 전까지 소를 제기할 수 없다."], ans: 3, exp: "금감원 금융분쟁조정위원회의 조정안을 당사자가 수락하면 <strong>재판상 화해와 동일한 효력</strong>을 갖습니다(협회 조정은 민법상 화해)." },
  { id: 34, subj: 1, q: "자금세탁방지제도(AML)에 대한 설명으로 바르지 못한 것은?", opts: ["자금세탁은 일반적으로 '예치(배치) → 은폐(반복) → 합법화(통합)'의 3단계를 거친다.", "고객확인제도(CDD)상 전신송금의 경우 100만원 초과 시 송금인 및 수취인 정보를 확인해야 한다.", "고위험 고객에 대한 위험평가 재수행 주기는 1년이며, 중·저위험 고객은 3년이다.", "의심거래보고제도(STR)는 1거래일 동안 1천만원 이상의 현금거래가 발생한 경우에만 보고한다."], ans: 4, exp: "의심거래보고(STR)는 <strong>금액과 무관</strong>하게 불법재산 의심 시 보고하며, 1거래일 1천만원 이상 현금거래 보고는 <strong>고액현금거래보고(CTR)</strong>입니다." },
  { id: 35, subj: 1, q: "신탁재산의 법적 특성 및 주요 신탁상품에 대한 설명으로 바르지 못한 것은?", opts: ["신탁재산은 수탁자의 고유재산과 분리되므로 수탁자가 파산하더라도 파산재단에 포함되지 않는다.", "신탁 전의 원인으로 발생한 권리 또는 신탁사무의 처리상 발생한 권리에 기한 경우에는 신탁재산에 대한 강제집행이 가능하다.", "특정금전신탁은 모든 자산으로 운용할 수 있으며, 보험회사의 보험상품으로도 운용할 수 있다.", "금전채권신탁은 채권의 추심·관리보다 수익증권 양도를 통한 자산유동화 목적으로 주로 활용된다."], ans: 3, exp: "특정금전신탁은 모든 자산으로 운용할 수 있으나 <strong>보험상품으로는 운용이 금지</strong>되어 있습니다." },
  { id: 36, subj: 1, q: "현행 연금저축계좌(연금저축펀드·보험 등)의 세제 혜택에 대한 설명으로 바르지 못한 것은?", opts: ["연간 납입한도는 1,800만원이며, 세액공제 대상 납입한도는 연 600만원(IRP 합산 시 900만원)이다.", "총급여 5,500만원 이하(종합소득 4,500만원 이하) 거주자는 16.5%, 초과자는 13.2%의 세액공제율을 적용받는다.", "연금수령 시 연령에 따라 3.3%~5.5%의 연금소득세가 원천징수된다.", "사적연금 수령액이 연간 1,500만원을 초과하는 경우 무조건 종합소득세 신고 대상이 되며 분리과세는 선택할 수 없다."], ans: 4, exp: "사적연금 연간 1,500만원 초과 수령 시 <strong>종합과세 또는 16.5% 분리과세 중 선택</strong>할 수 있습니다." },
  { id: 37, subj: 1, q: "펀드 판매절차(KYC 포함)의 순서로 가장 적절한 것은?", opts: ["투자자정보 파악 → 투자자 유형분류 → 적합한 펀드선정 → 펀드설명 → 투자자 의사확인 → 사후관리", "투자자 유형분류 → 투자자정보 파악 → 적합한 펀드선정 → 투자자 의사확인 → 펀드설명 → 사후관리", "적합한 펀드선정 → 투자자정보 파악 → 투자자 유형분류 → 펀드설명 → 투자자 의사확인 → 사후관리", "투자자정보 파악 → 적합한 펀드선정 → 투자자 유형분류 → 펀드설명 → 사후관리 → 투자자 의사확인"], ans: 1, exp: "표준투자권유준칙상 펀드 판매절차는 <strong>투자자정보 파악 → 유형분류 → 적합한 펀드선정 → 펀드설명 → 투자자 의사확인 → 사후관리</strong> 순입니다." },
  { id: 38, subj: 1, q: "투자자 성향분류 방식 중 각 설문에 대한 답변을 통해 부적합한 상품을 순차적으로 제거하여 불완전판매 가능성을 가장 낮출 수 있는 방식은?", opts: ["점수화방식", "추출방식", "혼합방식", "상담보고서방식"], ans: 2, exp: "각 설문 답변을 통해 부적합 상품을 순차적으로 제거하는 방식은 <strong>추출방식</strong>입니다." },
  { id: 39, subj: 1, q: "수익증권저축에 대한 설명으로 바르지 못한 것은?", opts: ["거치식저축은 동일 계좌에 추가 납입할 수 없으며, 필요시 별도의 계좌를 개설해야 한다.", "정액적립식저축에서 6개월 이상 저축금을 미납한 경우 판매회사는 14일 이상의 기간을 정해 추가납입을 최고한 후 임의해지할 수 있다.", "저축자가 세금정산을 목적으로 수익증권 전부를 환매하고 즉시 재매입하는 경우 연 1회에 한해 환매·판매수수료를 면제한다.", "저축재산의 일부 인출 시에는 먼저 매수한 수익증권부터 환매하는 선입선출 원칙을 적용한다."], ans: 3, exp: "세금정산 목적의 환매 후 즉시 재매입 시 수수료 면제는 <strong>연 2회 한도</strong>로 인정됩니다." },
  { id: 40, subj: 1, q: "현행 소득세법상 집합투자기구(펀드) 과세제도에 대한 설명으로 바르지 못한 것은?", opts: ["금융투자소득세가 폐지됨에 따라 세법상 적격 펀드의 이익은 기존과 동일하게 배당소득으로 과세된다.", "펀드의 이익은 펀드 단계에서 매년 법인세 또는 소득세로 직접 과세된다.", "국내 증권시장에 상장된 주식을 펀드가 직접 매매하여 발생한 매매차익은 과세제외된다.", "펀드 전체로는 원금 대비 투자손실이 발생했더라도 과세표준기준가격이 상승했다면 세금이 부과될 수 있다."], ans: 2, exp: "펀드의 이익은 펀드 단계가 아니라 <strong>투자자가 이익을 분배받거나 환매하는 시점</strong>에 과세됩니다(도관 이론)." },
  { id: 41, subj: 1, q: "채권의 수익률곡선, 듀레이션 및 컨벡시티(볼록성)에 대한 설명으로 바르지 못한 것은?", opts: ["일반적으로 채권의 잔존만기가 길수록 수익률이 높아지는 우상향 형태의 수익률곡선이 나타난다.", "다른 조건이 동일할 때 표면이자율이 높을수록 듀레이션은 짧아지고 가격변동위험은 감소한다.", "무이표채권의 듀레이션은 해당 채권의 만기와 일치한다.", "일반채권의 컨벡시티는 금리 상승 시 음(-)의 값을, 금리 하락 시 양(+)의 값을 갖는다."], ans: 4, exp: "일반채권의 컨벡시티(볼록성)는 금리 상승과 하락 모두에서 <strong>항상 양(+)의 값</strong>을 갖습니다." },
  { id: 42, subj: 1, q: "채권투자위험 중 금리 상승으로 인한 채권가격 하락 위험을 헤지(Hedge)하는 방법으로 적절하지 않은 것은?", opts: ["보유 중인 채권을 매도한다.", "국채선물을 매수한다.", "금리스왑에서 고정금리 지급 포지션을 취한다.", "고정금리부채권을 매도하고 변동금리부채권(FRN)을 매입한다."], ans: 2, exp: "금리 상승(채권가격 하락) 위험을 헤지하려면 국채선물을 <strong>매도</strong>해야 합니다." },
  { id: 43, subj: 1, q: "마이클 포터(M. E. Porter)의 산업경쟁구조분석(5 Forces)에서 기존 기업에게 유리한 산업 환경이 아닌 것은?", opts: ["신규 진입자의 진입장벽이 높을수록 유리하다.", "대체재의 존재 및 대체 가능성이 낮을수록 유리하다.", "기존 기업 간의 경쟁 치열도가 낮을수록 유리하다.", "구매자와 공급자의 가격교섭력이 높을수록 기존 기업에게 유리하다."], ans: 4, exp: "구매자와 공급자의 가격교섭력이 <strong>낮을수록</strong> 기존 기업에게 유리합니다." },
  { id: 44, subj: 1, q: "주가배수를 이용한 상대가치 평가방법에 대한 설명으로 바르지 못한 것은?", opts: ["PER은 주가가 주당순이익(EPS)의 몇 배인지를 나타내며, 낮을수록 저평가된 것으로 본다.", "PBR은 주가가 주당순자산(BPS)의 몇 배인지를 나타내며, 청산가치 개념에 기반한 저량(Stock) 지표이다.", "PSR은 매출액을 기준으로 하므로 회계처리에 따른 왜곡이나 조작 가능성이 가장 높다.", "EV/EBITDA는 영업현금흐름 창출능력 대비 기업가치를 평가하므로 감가상각비가 큰 장치산업 분석에 유용하다."], ans: 3, exp: "PSR(주가매출액비율)은 매출액을 기준으로 하므로 <strong>회계적 왜곡·조작 가능성이 가장 낮습니다</strong>." },
  { id: 45, subj: 1, q: "제임스 토빈(James Tobin)의 '토빈의 q' 비율에 대한 설명으로 옳은 것은?", opts: ["기업의 시장가치를 장부가치로 나눈 비율이다.", "토빈의 q가 1보다 크면 신규 시설투자보다는 기존 기업을 인수(M&A)하는 것이 유리하다.", "토빈의 q가 1보다 작으면 기업인수(M&A)의 표적이 되기 쉽다.", "토빈의 q가 1보다 작을수록 해당 산업으로의 신규 진입이 심화된다."], ans: 3, exp: "토빈의 q가 1보다 낮으면 대체원가보다 시장가치가 낮아 <strong>기업인수(M&A)의 표적</strong>이 되기 쉽습니다." },
  { id: 46, subj: 1, q: "채권 및 주식의 적극적·소극적 운용전략에 대한 설명으로 바르지 못한 것은?", opts: ["채권면역전략은 포트폴리오의 듀레이션과 투자기간을 일치시켜 금리변동위험을 제거하는 소극적 전략이다.", "수익률곡선 타기 전략(롤링효과)은 수익률곡선이 우상향할 때 잔존만기 감소에 따른 자본이득을 노리는 적극적 전략이다.", "바벨형 채권운용전략은 단기채와 장기채에 집중 투자하며, 단기금리 하락 및 장기금리 상승이 예상될 때 유리하다.", "인덱스 투자전략은 시장의 효율성을 전제로 벤치마크 수익률 추종을 목표로 하는 소극적 전략이다."], ans: 3, exp: "바벨형 전략은 <strong>단기금리 상승, 장기금리 하락</strong>이 예상될 때 유리합니다." },
  { id: 47, subj: 1, q: "2026년 기준 국내외 ESG 공시제도에 대한 설명으로 바르지 못한 것은?", opts: ["금융위원회가 발표한 '지속가능성 공시 로드맵'에 따르면 연결자산 30조원 이상 코스피 상장사부터 2028년(FY2027) 의무공시가 시작된다.", "국내 지속가능성 공시 로드맵상 가치사슬 배출량(Scope 3) 공시는 3년간 유예되어 FY2030부터 적용된다.", "유럽연합(EU)은 옴니버스 패키지를 통해 CSRD 적용 대상을 임직원 1,000명 초과 및 순매출 4.5억 유로 초과 기업으로 축소하였다.", "TCFD는 현재도 독립적인 글로벌 공시기구로서 전 세계 기업의 기후공시 기준 제정을 직접 총괄하고 있다."], ans: 4, exp: "TCFD는 2023년 임무를 완료하고 해산되었으며, 그 기능은 <strong>ISSB(IFRS S1·S2)로 이관</strong>되었습니다." },
  { id: 48, subj: 1, q: "펀드의 위험지표 중 '절대적 위험지표'로만 올바르게 묶인 것은?", opts: ["표준편차, 최대손실예상금액(VaR)", "표준편차, 베타(Beta)", "최대손실예상금액(VaR), 추적오차(Tracking Error)", "공분산, 초과수익률"], ans: 1, exp: "절대적 위험지표는 <strong>표준편차와 VaR</strong>이며, 베타·공분산·추적오차·초과수익률은 상대적 위험지표입니다." },
  { id: 49, subj: 1, q: "펀드의 위험조정성과 지표에 대한 설명으로 바르지 못한 것은?", opts: ["샤프비율(Sharpe Ratio)은 총위험(표준편차) 1단위당 무위험수익률 대비 초과수익률을 측정한다.", "젠센의 알파(Jensen's Alpha)는 펀드매니저의 운용역량을 평가할 수 있으나 종목선택 성과와 시장예측 성과를 구분하기 어렵다.", "정보비율(Information Ratio)은 펀드의 초과수익률을 무위험수익률로 나눈 값이다.", "트래킹에러(Tracking Error)는 펀드 수익률과 벤치마크 수익률 간 차이의 표준편차이다."], ans: 3, exp: "정보비율(IR)은 <strong>벤치마크 대비 초과수익률(Rp - Rb)을 추적오차(TE)로 나눈 값</strong>입니다." },
  { id: 50, subj: 1, q: "다음 자료를 바탕으로 계산한 A펀드의 샤프비율과 젠센의 알파로 옳은 것은?", box: "• A펀드 연수익률: 14%, 표준편차: 10%, 베타: 1.2<br>• 시장수익률: 10%, 무위험수익률: 4%", opts: ["샤프비율: 1.0, 젠센의 알파: 2.8%", "샤프비율: 1.0, 젠센의 알파: 4.0%", "샤프비율: 1.4, 젠센의 알파: 2.8%", "샤프비율: 1.4, 젠센의 알파: 4.0%"], ans: 1, exp: "샤프비율 = (14% - 4%) / 10% = <strong>1.0</strong>, 젠센의 알파 = 14% - [4% + 1.2 × (10% - 4%)] = 14% - 11.2% = <strong>2.8%</strong>." },
  { id: 51, subj: 1, q: "자본시장법상 집합투자증권의 광고 시 반드시 포함되어야 하는 사항으로 가장 거리가 먼 것은?", opts: ["집합투자증권을 취득하기 전에 투자설명서를 읽어볼 것을 권고하는 내용", "집합투자기구 평가회사의 등급 평가 결과", "투자원금의 손실이 발생할 수 있으며 그 손실은 투자자에게 귀속된다는 사실", "과거의 운용실적이 미래의 수익률을 보장하지 않는다는 내용"], ans: 2, exp: "집합투자기구 평가회사의 평가결과는 임의 기재사항일 뿐 필수 포함사항(권고·위험·수익)이 아닙니다." },
  { id: 52, subj: 1, q: "다음 중 자본시장법상 증권신고서 제출 면제 대상 증권이 아닌 것은?", opts: ["국채증권", "지방채증권", "한국은행 통화안정증권", "공모 투자신탁의 수익증권(모집금액 20억원)"], ans: 4, exp: "공모 투자신탁 수익증권 모집금액이 10억원 이상인 경우 증권신고서를 제출해야 합니다." },
  { id: 53, subj: 1, q: "투자권유를 받은 투자자가 거부의사를 표시한 경우, 재권유가 허용되는 요건으로 옳은 것은?", opts: ["거부의사 표시 후 15일이 경과한 경우 동일한 상품의 재권유가 가능하다.", "거부의사 표시 후 1개월이 경과한 경우 다른 종류의 금융투자상품에 한해 권유할 수 있다.", "장외파생상품에 대해서는 거부의사를 표시했더라도 1개월이 경과하면 재권유할 수 있다.", "투자자가 거부의사를 표시하면 어떠한 경우에도 영구적으로 투자권유를 할 수 없다."], ans: 2, exp: "거부의사 표시 후 <strong>1개월이 경과</strong>한 경우 <strong>다른 종류의 상품</strong>에 한해 권유할 수 있습니다(장외파생상품 제외)." },
  { id: 54, subj: 1, q: "펀드 세제상 적격 집합투자기구가 충족해야 하는 요건으로 바르지 못한 것은?", opts: ["자본시장법에 따른 집합투자기구일 것", "설정일부터 매년 1회 이상 결산·분배할 것", "금전으로 위탁받아 금전으로 환급할 것(단, 집합투자증권이 증권시장에 상장된 경우 등 예외 인정)", "반드시 공모집합투자기구일 것"], ans: 4, exp: "사모집합투자기구도 특정단독사모펀드가 아니면 세법상 적격 펀드 요건을 충족할 수 있습니다." },
  { id: 55, subj: 1, q: "다음 중 원금보장형 또는 원금보존추구형 상품 구조에 대한 설명으로 바르지 못한 것은?", opts: ["주가지수연동예금(ELD)은 은행이 발행하는 정기예금으로 예금자보호법의 보호를 받는다.", "주가연계증권(ELS)은 투자매매업자가 발행하며 발행사의 신용위험에 노출된다.", "주가연계펀드(ELF)는 자산의 대부분을 채권에 투자하고 이자로 워런트를 매수하여 원금보존추구형으로 설계할 수 있다.", "연금신탁을 제외한 일반 신탁상품과 펀드는 원금보장 약정이 가능하다."], ans: 4, exp: "<strong>연금신탁을 제외한 일반 신탁상품과 펀드는 원금보장 약정이 금지</strong>되어 있습니다(실적배당 원칙)." },
  { id: 56, subj: 1, q: "기술적 분석의 패턴 중 추세의 전환을 예고하는 '반전형 패턴'에 해당하는 것은?", opts: ["삼각형 패턴", "깃발형 패턴", "쐐기형 패턴", "삼봉형(헤드앤숄더) 패턴"], ans: 4, exp: "삼봉형(헤드앤숄더)은 반전형 패턴이며, 삼각형·깃발형·쐐기형은 지속형 패턴입니다." },
  { id: 57, subj: 1, q: "자본시장법상 집합투자기구의 수시공시 사유 및 방법에 대한 설명으로 바르지 못한 것은?", opts: ["투자운용인력의 변경이 있는 경우 그 사실과 변경된 인력의 운용경력을 수시공시해야 한다.", "수익자총회의 결의내용은 수시공시 대상에 해당한다.", "집합투자업자·판매회사·금융투자협회의 인터넷 홈페이지 공시, 전자우편 발송, 영업점 게시 중 하나를 선택하여 이행한다.", "부도채권 발생이나 환매연기 결정도 수시공시 대상이다."], ans: 3, exp: "집합투자업자·판매회사·협회 홈페이지 공시, 전자우편, 영업점 게시 <strong>3가지 방법 모두</strong>를 이행해야 합니다." },
  { id: 58, subj: 1, q: "투자신탁과 투자회사의 비교 설명으로 바르지 못한 것은?", opts: ["투자신탁의 법률행위 주체는 신탁업자이며, 투자회사의 법률행위 주체는 투자회사 법인 자체이다.", "투자신탁은 일반사무관리회사 선임이 의무사항이나, 투자회사는 선택사항이다.", "투자신탁은 수익자총회를, 투자회사는 주주총회를 최고 의사결정기구로 둔다.", "국내에 설정·설립된 대부분의 공모펀드는 투자신탁 형태를 취하고 있다."], ans: 2, exp: "투자신탁은 일반사무관리회사 선임이 선택사항이나, <strong>투자회사는 의무사항</strong>입니다." },
  { id: 59, subj: 1, q: "펀드 벤치마크(Benchmark)의 구비요건 및 특성에 대한 설명으로 바르지 못한 것은?", opts: ["벤치마크는 펀드의 운용이 시작되기 전에 사전에 정의되어야 한다.", "벤치마크 수익률은 투자자가 원하는 기간마다 객관적으로 확인하거나 산출할 수 있어야 한다.", "2개 이상의 시장지수를 일정 비율로 합성한 합성지수도 벤치마크로 활용할 수 있다.", "펀드평가에서 유형평균 수익률은 절대평가 기준이며, 벤치마크는 상대평가 기준이다."], ans: 4, exp: "<strong>벤치마크가 절대평가 기준</strong>이고, <strong>유형평균이 상대평가 기준</strong>입니다." },
  { id: 60, subj: 1, q: "다음 중 금융투자협회 분쟁조정제도(금융회사 간 분쟁)에 대한 설명으로 바르지 못한 것은?", opts: ["금융감독원 분쟁조정과 달리 금융회사 상호 간의 분쟁을 조정 대상으로 한다.", "합의기간은 30일이며, 조정기간은 30일(필요시 15일 연장 가능)이다.", "조정안 수락서 제출 기한은 20일이며, 재조정 신청 기한은 30일이다.", "금융투자협회 분쟁조정위원회의 조정을 당사자가 수락하면 재판상 화해와 동일한 효력을 갖는다."], ans: 4, exp: "<strong>금융감독원</strong> 분쟁조정만 재판상 화해 효력을 가지며, 금융투자협회 분쟁조정 성립은 <strong>민법상 화해계약</strong>의 효력을 갖습니다." },

  // 제2과목: 파생상품펀드 (61~85)
  { id: 61, subj: 2, q: "자본시장법상 파생상품펀드 및 위험평가액 규정에 대한 설명으로 바르지 못한 것은?", opts: ["실무적으로 파생상품 매매에 따른 위험평가액이 펀드 자산총액의 10%를 초과하거나, 파생결합증권에 50%를 초과 투자하는 펀드를 말한다.", "공모펀드의 파생상품 매매에 따른 위험평가액은 순자산총액의 100%를 초과할 수 없다(사모펀드는 400%).", "공모펀드는 동일 종목의 파생결합증권에 펀드 자산총액의 30%까지 투자할 수 있다.", "단기금융집합투자기구(MMF)를 포함한 모든 집합투자기구는 위험평가액 100% 한도 내에서 파생상품에 투자할 수 있다."], ans: 4, exp: "<strong>단기금융집합투자기구(MMF)는 파생상품에 투자할 수 없습니다</strong>." },
  { id: 62, subj: 2, q: "파생상품 매매에 따른 위험평가액(명목계약금액) 산정방법으로 올바르게 연결된 것은?", opts: ["선물거래: 기초자산가격 × 계약수 × 승수 × 델타", "옵션매수: 기초자산가격 × 계약수 × 승수", "옵션매도: 델타위험액 + 감마위험액 + 베가위험액", "통화스왑: 만기까지 지급하기로 한 이자총액"], ans: 3, exp: "① 선물은 델타를 곱하지 않음, ② 옵션매수는 델타를 곱함, ④ 통화스왑은 지급하기로 한 통화의 명목원금입니다." },
  { id: 63, subj: 2, q: "파생상품펀드의 공시대상 위험지표 및 공시주기에 대한 설명으로 바르지 못한 것은?", opts: ["계약금액과 만기시점의 손익구조는 파생상품 거래 후 다음날까지 공시하여야 한다.", "시나리오별 손익구조 변동(Stress Test)과 최대손실예상금액(VaR)은 매일 공시하여야 한다.", "최대손실예상금액(VaR)은 10영업일의 보유기간과 99% 신뢰구간을 적용하여 산출한다.", "사모펀드와 기관전용 사모펀드도 공모펀드와 동일하게 위험지표를 인터넷 홈페이지에 매일 공시해야 한다."], ans: 4, exp: "사모펀드 및 기관전용 사모펀드는 <strong>위험지표 공시의무가 적용되지 않습니다</strong>." },
  { id: 64, subj: 2, q: "장외파생상품 매매에 따른 위험평가액이 집합투자기구 자산총액의 10%를 초과할 수 있는 펀드가 취해야 할 조치로 옳은 것은?", opts: ["위험관리방법을 작성하여 신탁업자의 확인을 받은 후 금융위원회에 신고해야 한다.", "위험관리방법을 작성하여 판매회사의 확인을 받은 후 한국거래소에 신고해야 한다.", "적격요건을 갖추지 못한 거래상대방과 장외파생상품을 매매할 때는 별도 공시를 해야 한다.", "투자권유대행인을 통해 파생상품펀드의 투자권유를 위탁할 수 있다."], ans: 1, exp: "장외파생상품 위험평가액이 자산총액의 10%를 초과할 수 있는 펀드는 위험관리방법을 작성해 <strong>신탁업자 확인 후 금융위원회에 신고</strong>해야 합니다." },
  { id: 65, subj: 2, q: "워런트(Warrant) 투자형 주가연계 파생상품펀드의 수익구조에 대한 설명으로 바르지 못한 것은?", opts: ["디지털(Digital) 구조는 기초자산 가격이 조건을 충족하면 약정된 쿠폰을 받고, 그렇지 못하면 받지 못하는 구조이다.", "레인지(Range) 구조는 기초자산 가격이 특정 구간 내에 머물 때만 일정한 수익을 얻는 구조이다.", "스프레드(Spread) 구조는 특정 구간 내에서는 수익이 상승하다가 구간을 넘어서면 수익이 고정되는 구조이다.", "낙인(Knock-In) 구조는 기초자산 가격이 일정 수준(Barrier)에 도달하면 기존의 수익구조가 소멸하는 구조이다."], ans: 4, exp: "조건 도달 시 기존 수익구조가 소멸하는 것은 <strong>낙아웃(Knock-Out)</strong>이며, 낙인(Knock-In)은 새로운 손익구조가 발생하는 것입니다." },
  { id: 66, subj: 2, q: "다음 조건을 가진 유럽형 디지털 콜워런트의 만기 수익률은 얼마인가?", box: "• 만기: 1년 / 행사가격: 105% / 쿠폰: 8%<br>• 기초자산 가격 흐름: 투자기간 중 최고 120%까지 상승했으나, 만기일에는 102%로 마감됨", opts: ["0%", "4%", "8%", "15%"], ans: 1, exp: "유럽형 디지털 콜옵션은 <strong>만기일 종가만 관찰</strong>합니다. 만기일(102%)이 행사가격(105%) 미만이므로 수익률은 <strong>0%</strong>입니다." },
  { id: 67, subj: 2, q: "만기 시점에 KOSPI200 지수가 25% 상승했을 때, 유럽형 콜워런트의 수익률이 20%로 확정되었다면 이 워런트의 참여율(Participation Rate)은?", opts: ["20%", "25%", "80%", "125%"], ans: 3, exp: "참여율 = 워런트 수익률(20%) ÷ 지수상승률(25%) = <strong>80%</strong>." },
  { id: 68, subj: 2, q: "주요 파생상품펀드 유형별 특성에 대한 설명으로 바르지 못한 것은?", opts: ["금리연계 파생상품펀드는 기초자산의 변동성이 작아 레버리지를 활용하는 경우가 많으며, 만기가 길어 공모펀드로 설정하기 어렵다.", "상품연계 파생상품펀드는 전통자산(주식·채권)과 상관관계가 낮아 분산투자 효과 및 인플레이션 헤지 효과를 기대할 수 있다.", "상품선물 투자 시 만기이월(Rollover) 과정에서 콘탱고 시장일 경우 롤오버 이익이 발생한다.", "멀티에셋(Multi-Asset) 파생상품펀드는 다양한 자산군에 분산투자하여 안정적이고 보수적인 수익을 추구한다."], ans: 3, exp: "선물가격이 현물가격보다 높은 <strong>콘탱고 시장에서는 롤오버 손실</strong>이 발생합니다(백워데이션에서 롤오버 이익)." },
  { id: 69, subj: 2, q: "포트폴리오 보험형 펀드의 투자기법에 대한 설명으로 바르지 못한 것은?", opts: ["주가 상승 시 주식 비중을 늘리고 하락 시 줄여 콜옵션 매수 포지션의 성과를 복제한다.", "방어적 풋(Protective Put) 전략은 주식 매수와 풋옵션 매수를 결합한 전략으로 옵션 매수 비용이 발생한다.", "이자추출전략(OBPI)은 채권 매수와 콜옵션 매수를 결합하여 원금을 보존하면서 상승 수익을 추구한다.", "시간불변 포트폴리오 보험(TIPP)은 최초 설정된 보장치가 무위험이자율로 일정하게 증가하는 방식이다."], ans: 4, exp: "최초 보장치가 무위험이자율로 증가하는 것은 <strong>CPPI</strong>이며, TIPP는 포트폴리오 최고가치에 비례해 보장치가 상향 조정됩니다." },
  { id: 70, subj: 2, q: "다음 중 파생상품펀드 운용전략별 특징이 바르게 연결되지 않은 것은?", opts: ["시장중립형: 현·선물 차익거래, 합병차익거래 등을 통해 시장 방향성과 무관한 절대수익을 추구한다.", "구조화형(델타헤징): 풋옵션 매도 포지션을 복제하며, 등락이 반복되는 박스권 장세에서 수익이 누적된다.", "시스템운용형: 모멘텀(추세추종) 전략을 주로 사용하므로 박스권·등락장에서 성과가 양호하고 추세장에서 부진하다.", "인덱스형: 패시브 전략의 일종으로 인버스형, 레버리지형 등으로 다양하게 설계할 수 있다."], ans: 3, exp: "시스템운용형(모멘텀 전략)은 <strong>추세장에서 성과가 양호하고, 박스권·등락장에서 부진</strong>합니다." },
  { id: 71, subj: 2, q: "현재 A기업이 B기업 주주에게 B주식 1주당 A주식 0.2주를 교부하는 흡수합병을 발표했다. 현재 시장에서 A주식은 20,000원, B주식은 3,500원에 거래되고 있을 때 가능한 합병차익거래는?", opts: ["A주식 매수, B주식 매도", "A주식 공매도, B주식 매수", "A주식과 B주식 동시 매수", "차익거래 기회 없음"], ans: 2, exp: "합병비율 기준 B주식 적정가치는 20,000 × 0.2 = 4,000원이나 시장가가 3,500원으로 저평가되어 있으므로 <strong>고평가된 A주식을 공매도하고 저평가된 B주식을 매수</strong>합니다." },
  { id: 72, subj: 2, q: "원금비보존형 스텝다운형 ELS(기초자산 2개)에서 제시수익률(쿠폰)이 높아지는 조건으로 바르지 못한 것은?", opts: ["조기상환 조건(배리어)이 높을수록 쿠폰이 높아진다.", "원금손실 발생 기준인 낙인(Knock-In) 수준이 높을수록 쿠폰이 높아진다.", "기초자산의 가격 변동성이 클수록 쿠폰이 높아진다.", "두 기초자산 간의 상관계수가 높을수록 쿠폰이 높아진다."], ans: 4, exp: "두 기초자산 간 <strong>상관계수가 낮을수록</strong> 손실 위험이 커지므로 제시수익률(쿠폰)이 높아집니다." },
  { id: 73, subj: 2, q: "주가지수선물의 균형가격 및 차익거래에 대한 설명으로 바르지 못한 것은?", opts: ["무위험이자율(r)이 배당수익률(d)보다 높으면 선물가격(F)이 현물가격(S)보다 높은 정상시장(Contango)이 된다.", "잔존만기가 길어지고 원화 이자율이 상승할수록 주가지수선물의 이론가격은 상승한다.", "실제 선물가격이 이론 선물가격보다 고평가된 경우 선물을 매도하고 현물을 매수하는 매수차익거래를 실행한다.", "선물거래에서 거래량은 누적되지 않으나, 미결제약정 수량은 매일 누적되어 증가한다."], ans: 4, exp: "선물시장에서 <strong>거래량은 누적되지만, 미결제약정은 신규·전매·환매에 따라 증감하므로 누적되지 않습니다</strong>." },
  { id: 74, subj: 2, q: "선물거래에서 개시증거금이 500만원, 유지증거금이 350만원일 때, 일일정산 결과 증거금 잔고가 300만원이 되었다면 추가로 납부해야 할 증거금(마진콜)은?", opts: ["50만원", "150만원", "200만원", "300만원"], ans: 3, exp: "증거금 잔고가 유지증거금(350만원) 미만으로 떨어지면 <strong>개시증거금(500만원) 수준까지 채워야 하므로</strong> 500 - 300 = <strong>200만원</strong>입니다." },
  { id: 75, subj: 2, q: "선물 헤지거래에 대한 설명으로 바르지 못한 것은?", opts: ["향후 현물 가격 하락이 예상될 때 보유 자산의 가치 하락을 방어하기 위해 선물을 매도하는 것을 매도헤지라 한다.", "만기 시점에 헤지 포지션을 청산할 경우 현·선물 가격이 일치하므로 베이시스 위험이 제거(제로 베이시스)된다.", "만기 이전에 헤지 포지션을 중도 청산할 경우 베이시스 변동으로 인한 베이시스 위험에 노출된다.", "헤지비율은 현물 포트폴리오의 베타와 무관하게 항상 1.0으로 고정하여 계약수를 산정한다."], ans: 4, exp: "헤지비율은 현물 포트폴리오의 베타(β)와 현·선물 가격 비율 등을 반영하여 산정합니다." },
  { id: 76, subj: 2, q: "현재 주가지수가 320pt일 때, 행사가격이 315pt이고 프리미엄이 7pt인 콜옵션의 내재가치(행사가치)와 시간가치로 옳은 것은?", opts: ["내재가치: 5pt, 시간가치: 2pt", "내재가치: 7pt, 시간가치: 0pt", "내재가치: 0pt, 시간가치: 7pt", "내재가치: 2pt, 시간가치: 5pt"], ans: 1, exp: "콜옵션 내재가치 = 320 - 315 = <strong>5pt</strong>, 시간가치 = 프리미엄(7pt) - 내재가치(5pt) = <strong>2pt</strong>." },
  { id: 77, subj: 2, q: "다음 옵션 합성전략 중 기초자산의 가격 변동성이 크게 확대될 것으로 예상할 때 유효한 전략은?", opts: ["콜 약세 스프레드 (낮은 행사가격 콜 매도 + 높은 행사가격 콜 매수)", "스트래들 매도 (동일 행사가격 콜 매도 + 풋 매도)", "스트랭글 매수 (낮은 행사가격 풋 매수 + 높은 행사가격 콜 매수)", "콜 레이쇼 버티칼 스프레드 (낮은 행사가격 콜 1계약 매수 + 높은 행사가격 콜 2계약 매도)"], ans: 3, exp: "변동성 확대를 예상할 때는 <strong>스트래들 매수</strong> 또는 <strong>스트랭글 매수</strong> 전략을 사용합니다." },
  { id: 78, subj: 2, q: "옵션 민감도 지표(Greeks)에 대한 설명으로 바르지 못한 것은?", opts: ["델타(Delta)는 기초자산 가격 1단위 변화에 대한 옵션 프리미엄의 변화분으로, 풋옵션 매수의 델타는 -1과 0 사이이다.", "감마(Gamma)는 기초자산 가격 변화에 대한 델타의 민감도로, 등가격(ATM) 옵션에서 가장 큰 값을 갖는다.", "세타(Theta)는 만기 잔존기간 감소에 따른 옵션가치 하락을 나타내며, 옵션 매수 포지션의 경우 항상 음(-)의 값을 갖는다.", "베가(Vega)는 무위험이자율 변동에 대한 옵션 프리미엄의 민감도를 나타낸다."], ans: 4, exp: "변동성(표준편차) 민감도는 베가(Vega), <strong>금리 민감도는 로(Rho)</strong>입니다." },
  { id: 79, subj: 2, q: "주요 파생상품 계약(FRA·스왑·CDS)에 대한 설명으로 바르지 못한 것은?", opts: ["금리선도계약(FRA) 매수자는 미래의 금리 상승 위험을 회피하려는 자금차입자 포지션에 해당한다.", "3개월 후 시작하여 6개월간 적용되는 금리에 대한 FRA 계약은 '3×6 FRA'로 표기한다.", "변동금리부 부채를 보유한 기업이 향후 금리 상승을 예상한다면 고정금리 지급 금리스왑을 체결해야 한다.", "신용부도스왑(CDS) 프리미엄은 준거기업의 부도확률이 높을수록, 준거자산의 회수율이 낮을수록 상승한다."], ans: 2, exp: "3개월 후 시작하여 6개월간 적용되는(총 9개월 만기) FRA 계약은 <strong>'3×9 FRA'</strong>로 표기합니다." },
  { id: 80, subj: 2, q: "이색옵션(Exotic Option)에 대한 설명으로 바르지 못한 것은?", opts: ["아시아형 옵션(평균옵션)은 만기 시점의 가격이 아닌 일정 기간의 평균가격을 기준으로 손익을 결정하므로 상품연계 펀드에 많이 활용된다.", "룩백(Lookback) 콜옵션은 투자기간 중 기초자산의 최저가격을 행사가격으로 하여 만기에 행사할 수 있는 옵션이다.", "선택옵션(Chooser Option)은 계약 체결 후 일정 시점에 매입자가 해당 옵션을 콜옵션으로 할지 풋옵션으로 할지 선택할 수 있다.", "무지개(Rainbow) 풋옵션은 복수의 기초자산 중 성과가 가장 좋은(최고가격) 기초자산을 기준으로 수익을 결정한다."], ans: 4, exp: "무지개(Rainbow) 콜옵션은 최고가격, <strong>무지개 풋옵션은 최저가격</strong> 기초자산을 기준으로 수익을 결정합니다." },
  { id: 81, subj: 2, q: "파생결합증권(ELS) 발행사가 BTB(Back-to-Back) 방식으로 헤지할 때의 리스크에 대한 설명으로 옳은 것은?", opts: ["장외파생상품 계약을 통해 수익구조를 이전하므로 시장리스크는 완전히 헤지된다.", "발행증권에 대한 신용리스크는 발행사가 부담하며 거래상대방 신용리스크는 전혀 없다.", "현금흐름 주기가 일치하지 않아 심각한 자금유동성 리스크에 직면한다.", "BTB 거래는 장내거래이므로 법률적 리스크가 전혀 존재하지 않는다."], ans: 1, exp: "BTB 방식은 시장리스크와 자금유동성 리스크를 완전히 헤지할 수 있으나, 거래상대방 신용리스크 및 법률적 리스크는 존재합니다." },
  { id: 82, subj: 2, q: "파생결합증권(ELS) 발행사가 자체헤지(Self-Hedging) 방식으로 운용할 때의 특징으로 바르지 못한 것은?", opts: ["시장리스크를 발행사가 직접 부담하며, 델타헤징 등의 운용성과가 발행사의 수익 또는 손실 원천이 된다.", "장외파생상품 거래 시 거래상대방의 신용리스크에 노출될 수 있다.", "BTB 방식과 마찬가지로 자금의 유출입이 완벽히 일치하므로 자금유동성 리스크가 없다.", "기초자산 급변 시 헤지 비용 증가로 인해 발행사가 대규모 손실을 입을 수 있다."], ans: 3, exp: "자체헤지 방식은 BTB 방식과 달리 <strong>자금유동성 및 상품유동성 리스크에 크게 노출</strong>됩니다." },
  { id: 83, subj: 2, q: "장외파생상품 거래 시 거래상대방 신용리스크를 경감하는 방법으로 가장 거리가 먼 것은?", opts: ["거래상대방의 신용등급 등 적격요건을 엄격히 제한하고 거래한도를 설정한다.", "ISDA 기본계약서 외에 담보제공계약(CSA)을 별도로 체결한다.", "통화스왑과 같이 원금을 교환하는 Funded Swap 방식을 적극 활용한다.", "파생결합증권 발행사의 신용등급을 분산하여 편입한다."], ans: 3, exp: "통화스왑(Funded Swap)은 원금을 교환하므로 신용리스크가 크며, 신용리스크를 줄이려면 원금을 교환하지 않는 <strong>Unfunded Swap</strong>을 활용합니다." },
  { id: 84, subj: 2, q: "파생상품펀드의 효율적 포트폴리오 관리 및 차익거래 전략에 대한 설명으로 바르지 못한 것은?", opts: ["백워데이션(F < S) 시장에서는 저평가된 주가지수선물을 매수하고 고평가된 주식을 매도하여 차익을 추구한다.", "풋-콜 패리티에 따라 콜옵션 매수와 풋옵션 매도를 결합하면 합성선물 매수 포지션을 구축할 수 있다.", "페어 트레이딩(Pair Trading)은 상관계수가 높은 두 종목의 일시적 가격 괴리가 축소될 것을 예상해 매수·매도를 병행하는 전략이다.", "해외자산에 투자하는 펀드에서 환율 상승이 예상될 때는 달러 선물환을 매도하여 환차익을 극대화한다."], ans: 4, exp: "환율 <strong>하락</strong>에 대비하여 달러 선물환을 매도합니다(환율 상승 예상 시 선물환 매수)." },
  { id: 85, subj: 2, q: "만 65세 이상 고령투자자로서 파생상품 등에 대한 투자경험이 2년인 일반투자자에게 투자권유가 허용되는 파생결합증권의 원금손실 한도는?", opts: ["원금손실률 0% (원금보장형만 가능)", "원금손실률 20% 이내", "원금손실률 50% 이내", "원금손실 한도 제한 없음"], ans: 2, exp: "만 65세 이상이면서 투자경험이 1년 이상~3년 미만인 경우 <strong>원금손실률 20% 이내</strong> 상품만 투자권유할 수 있습니다." },

  // 제3과목: 부동산펀드 (86~100)
  { id: 86, subj: 3, q: "자본시장법상 부동산집합투자기구의 법적 형태 및 설립·운영에 관한 설명으로 바르지 못한 것은?", opts: ["투자신탁, 투자회사, 투자유한회사, 투자합자회사, 투자유한책임회사, 투자합자조합, 투자익명조합 등 7가지 형태로 설립할 수 있다.", "부동산투자회사의 경우 설립주체는 발기인이며, 투자신탁의 경우 집합투자업자가 설정한다.", "부동산투자합자조합은 조합계약으로 무한책임조합원과 유한책임조합원의 이익 배당률과 손실 분담비율을 모두 차등 적용할 수 있다.", "일반적으로 임대형은 투자신탁으로, 개발사업 투자 시에는 유한책임이 보장되는 투자회사나 투자유한회사로 설립하는 경우가 많다."], ans: 3, exp: "부동산투자합자조합은 조합계약으로 이익 배당은 차등 적용할 수 있으나, <strong>손실 분담비율은 차등 배분할 수 없습니다</strong>." },
  { id: 87, subj: 3, q: "자본시장법상 부동산펀드의 자산운용제한 및 처분제한에 대한 설명으로 바르지 못한 것은?", opts: ["국내에 있는 부동산은 취득한 후 1년 이내에 처분하는 행위가 원칙적으로 금지된다.", "국외에 있는 부동산은 취득한 후 집합투자규약에서 정하는 기간 이내에 처분하는 행위가 금지된다.", "건축물 그 밖의 공작물이 없는 토지는 부동산개발사업을 시행하기 전에는 처분할 수 없다.", "공모 부동산펀드는 부동산개발회사가 발행한 주식에 펀드 자산총액의 30%를 초과하여 투자할 수 없다."], ans: 4, exp: "부동산개발회사 및 부동산투자목적회사가 발행한 주식에는 <strong>동일법인 발행 증권 투자한도(10%) 제한이 배제되어 100%까지 투자 가능</strong>합니다." },
  { id: 88, subj: 3, q: "자본시장법상 부동산펀드의 운용특례(금전차입·금전대여·업무위탁·자산평가)에 대한 설명으로 바르지 못한 것은?", opts: ["부동산펀드는 부동산 취득 등을 위해 펀드 순자산액의 200% 범위 내에서 금융기관 등으로부터 금전을 차입할 수 있다.", "부동산펀드 외의 펀드(혼합자산펀드 등)가 부동산을 취득하는 경우 보유 부동산 가액의 70% 한도로 차입할 수 있다.", "집합투자업자는 부동산의 개발, 관리·개량, 임대 업무뿐만 아니라 부동산의 취득 및 처분 업무도 제3자에게 위탁할 수 있다.", "부동산펀드의 자산 평가는 시가평가를 원칙으로 하되, 신뢰할 만한 시가가 없는 경우 공정가액으로 평가한다."], ans: 3, exp: "개발, 관리·개량, 임대 업무는 제3자 위탁이 가능하나, <strong>부동산의 취득 및 처분 업무는 위탁이 금지</strong>되어 있습니다." },
  { id: 89, subj: 3, q: "자본시장법상 부동산펀드가 금전을 차입할 수 있는 금융기관 등에 해당하지 않는 것은?", opts: ["은행법에 따른 은행", "보험업법에 따른 보험회사", "다른 부동산집합투자기구", "새마을금고법에 따른 새마을금고"], ans: 4, exp: "<strong>새마을금고</strong>, 신협·농협·수협 단위조합 등에서는 금전을 차입할 수 없습니다." },
  { id: 90, subj: 3, q: "부동산의 자연적·인문적 특성 및 물권의 효력에 대한 설명으로 바르지 못한 것은?", opts: ["부동성(지리적 위치의 고정성)으로 인해 부동산 시장은 지역별로 국지화되는 경향이 있다.", "부증성(비생산성)으로 인해 토지의 물리적 공급은 비탄력적이며 지가 상승의 원인이 된다.", "개별성(비대체성)으로 인해 부동산 상품 간 완전한 대체가 어려워 일물일가의 법칙이 성립하지 않는다.", "물권과 채권이 충돌할 경우 항상 먼저 성립한 권리가 우선하므로 채권이 먼저 성립했다면 물권에 우선한다."], ans: 4, exp: "물권과 채권이 충돌하면 성립 시기와 관계없이 <strong>원칙적으로 물권이 우선</strong>합니다." },
  { id: 91, subj: 3, q: "부동산펀드의 투자대상에 따른 분류 및 점검사항에 대한 설명으로 바르지 못한 것은?", opts: ["임대형 부동산펀드는 실물형 펀드의 대표적 형태로 임대료 수준, 공실률 추이, 운용비용 등을 중점 점검해야 한다.", "경·공매형 부동산펀드는 투자 대상을 사전에 정하지 않고 자금을 먼저 모집하는 사전불특정(Blind)형 펀드 성격을 지닌다.", "개량형 부동산펀드는 리모델링 등 개량에 소요되는 자본적 지출보다 개량 후 임대·매각 수익 증가분이 커야 한다.", "개발형 부동산펀드는 부동산개발회사에 대출 형태로 자금을 공급하고 확정된 대출이자를 수취하는 펀드이다."], ans: 4, exp: "개발형은 직접 개발·분양·임대하는 실물형 펀드이며, 개발법인에 대출하여 이자를 받는 것은 <strong>대출형(PF형) 부동산펀드</strong>입니다." },
  { id: 92, subj: 3, q: "대출형 부동산펀드에서 주로 활용되는 프로젝트 파이낸싱(PF)에 대한 설명으로 바르지 못한 것은?", opts: ["사업주의 신용이나 기존 자산이 아닌 프로젝트 자체의 미래 현금흐름과 사업성을 담보로 자금을 조달한다.", "원칙적으로 사업주(모기업)에 대해 상환청구권이 없거나 제한되는 비소구·제한적 소구금융이다.", "사업주의 재무상태표에 부채로 계상되지 않는 부외금융(Off-Balance Sheet Financing) 효과를 갖는다.", "자금조달 규모가 작고 만기가 짧아 일반 기업대출보다 금리 조건이 항상 낮게 책정된다."], ans: 4, exp: "PF 대출은 사업 리스크가 높아 일반 기업대출보다 <strong>금리 조건이 높게 책정</strong>되며 자금 규모가 크고 만기가 깁니다." },
  { id: 93, subj: 3, q: "부동산 시장과 디파스퀘일-휘튼(DiPasquale-Wheaton) 4분면 모형에 대한 설명으로 바르지 못한 것은?", opts: ["부동산 시장은 공간시장(임대시장), 자산시장, 개발시장으로 상호 연계되어 작동한다.", "개발시장에서는 부동산의 시장가격이 대체원가(건설원가)보다 클 때 신규 개발이 이루어진다.", "시중 이자율이 상승하면 자산시장의 자본환원율이 상승하여 부동산 자산가격이 하락한다.", "이자율 상승으로 자산가격이 하락하면 신규 개발과 재고량이 증가하여 장기적으로 임대료가 하락한다."], ans: 4, exp: "이자율 상승으로 자산가격이 하락하면 신규 개발이 위축되어 <strong>재고량이 감소하고 장기적으로 임대료가 상승</strong>합니다." },
  { id: 94, subj: 3, q: "부동산 경기변동의 4국면에 대한 설명으로 바르지 못한 것은?", opts: ["부동산 경기변동은 일반 경기변동이나 주가지수보다 후행하는 경향이 있다.", "호황국면에서는 거래가 활발하고 가격이 상승하며 매도인 우위 시장이 형성된다.", "후퇴국면에서는 거래량과 가격이 하향세로 전환되며 공실률이 증가하기 시작한다.", "회복국면에서는 공실률이 지속적으로 증가하고 매수인 우위 시장이 심화된다."], ans: 4, exp: "회복국면에서는 <strong>공실률이 감소하고 매도인 우위 시장으로 전환</strong>됩니다." },
  { id: 95, subj: 3, q: "부동산 시장의 수요와 공급 요인에 대한 설명으로 바르지 못한 것은?", opts: ["정상재인 부동산의 경우 가계 소득이 증가하고 핵가족화가 진행되면 부동산 수요가 증가한다.", "담보인정비율(LTV)과 총부채상환비율(DTI) 한도가 상향(완화)되면 부동산 수요가 증가한다.", "건설 원자재 가격과 인건비가 상승하면 건설비용 증가로 부동산 공급이 감소한다.", "향후 부동산 가격이 하락할 것으로 기대되면 현재 시점의 부동산 수요는 증가하고 공급은 감소한다."], ans: 4, exp: "향후 부동산 가격 하락이 기대되면 현재 시점의 <strong>수요는 감소하고 공급은 증가</strong>합니다." },
  { id: 96, subj: 3, q: "정부의 부동산 정책 중 시장에 가장 직접적인 영향을 미치는 정책 수단으로 옳은 것은?", opts: ["기준금리 인상 및 대출규제 강화(수요정책)", "용도지역·지구 조정 및 택지개발사업(공급정책)", "분양가상한제 및 임대료상한제 시행(가격정책)", "양도소득세 및 종합부동산세율 조정(조세정책)"], ans: 3, exp: "분양가상한제·임대료상한제 등의 <strong>가격정책</strong>이 부동산 시장에 가장 직접적인 영향을 미칩니다." },
  { id: 97, subj: 3, q: "전통적 투자자산(주식·채권)과 비교한 대체투자(부동산펀드 등)의 특성으로 바르지 못한 것은?", opts: ["전통적 투자자산과의 상관관계가 낮아 포트폴리오 분산투자 효과가 크다.", "환매금지형으로 설정되는 경우가 많아 유동성이 낮고 투자기간이 장기이다.", "투자 약정 후 자금 소요 시마다 분할 납입하는 캐피탈 콜(Capital Call) 방식이 주로 활용된다.", "매일 시장에서 거래되므로 객관적인 시가 평가가 매우 용이하며 운용보수가 저렴하다."], ans: 4, exp: "부동산 등 대체투자는 시가 평가가 곤란하여 공정가액 평가를 주로 활용하며, 유동성이 낮고 <strong>수수료가 높은 편</strong>입니다." },
  { id: 98, subj: 3, q: "부동산 투자위험의 관리방안으로 적절하지 않은 것은?", opts: ["가격변동위험 관리를 위해 상장 지수선물 등 파생상품을 활용하면 개별 부동산의 위험을 완벽히 헤지할 수 있다.", "유동성위험을 줄이기 위해 매각 시점에 활용할 수 있는 사전옵션계약이나 풋백옵션을 체결한다.", "관리운영 및 임대위험을 완화하기 위해 우량 임차인과 장기임대차계약을 체결하거나 전문관리업체에 위탁한다.", "개발위험 관리를 위해 시공사에 책임준공 의무를 부과하고 확정가격에 의한 일괄도급계약을 체결한다."], ans: 1, exp: "부동산은 개별성이 강해 표준화된 파생금융상품으로 가격변동위험을 헤지하기 곤란합니다." },
  { id: 99, subj: 3, q: "임대형 부동산펀드의 '매입단계'에서 점검해야 할 리스크 요인과 가장 거리가 먼 것은?", opts: ["유사 거래사례와 감정평가액을 기준으로 한 매입가격의 적정성", "소유권 분쟁이나 유치권·저당권 등 권리상 하자에 따른 법률적 위험", "건물 노후화나 설비 결함 등 물리적 실사를 통한 물리적 위험", "보유 기간 중 임차인의 임대료 연체 및 명도 지연에 따른 임차인 위험"], ans: 4, exp: "임차인의 임대료 체납 및 명도 지연 위험은 매입단계가 아닌 <strong>운용단계</strong>에서 관리하는 리스크입니다." },
  { id: 100, subj: 3, q: "해외부동산펀드 투자 시 직면할 수 있는 고유 리스크에 대한 설명으로 가장 거리가 먼 것은?", opts: ["현지 국가의 세법 개정이나 조세협약 변경에 따른 조세 위험", "환헤지 미실시 또는 과다·과소 헤지로 인한 환율변동 위험", "현지 시장 정보 접근성 제한 및 글로벌 신용경색으로 인한 매각 지연 위험", "국내 판매회사의 고유재산 파산으로 인해 펀드 신탁재산이 몰수되는 위험"], ans: 4, exp: "펀드 신탁재산은 법적으로 판매회사나 집합투자업자의 고유재산과 엄격히 분리되므로 <strong>판매회사가 파산하더라도 신탁재산은 안전하게 보호</strong>됩니다." }
];

const subjMap = {
  1: "제1과목 · 펀드일반",
  2: "제2과목 · 파생상품펀드",
  3: "제3과목 · 부동산펀드"
};

const STORAGE_ANSWERS = "fund100_editorial_answers_v1";
const STORAGE_WRONGS = "fund100_editorial_wrongs_v1";

let userAnswers = JSON.parse(localStorage.getItem(STORAGE_ANSWERS) || "{}");
let wrongSet = new Set(JSON.parse(localStorage.getItem(STORAGE_WRONGS) || "[]"));
let currentFilter = "all";
let currentIndex = 0;

function saveState() {
  localStorage.setItem(STORAGE_ANSWERS, JSON.stringify(userAnswers));
  localStorage.setItem(STORAGE_WRONGS, JSON.stringify([...wrongSet]));
}

function getFilteredList() {
  if (currentFilter === "all") return questions;
  if (currentFilter === "wrong") return questions.filter(q => wrongSet.has(q.id));
  return questions.filter(q => String(q.subj) === currentFilter);
}

function setFilter(filter) {
  currentFilter = filter;
  currentIndex = 0;
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.filter === filter);
  });
  const STORAGE_HEADER_COLLAPSED = "fund100_header_collapsed_v1";

function applyHeaderCollapseState(isCollapsed) {
  const panel = document.getElementById("header-collapsible");
  const bar = document.getElementById("collapse-bar");
  const btn = document.getElementById("btn-toggle-header");
  if (!panel || !bar || !btn) return;
  panel.classList.toggle("is-collapsed", isCollapsed);
  bar.classList.toggle("collapsed-only", isCollapsed);
  btn.setAttribute("aria-expanded", String(!isCollapsed));
  btn.textContent = isCollapsed ? "상단 메뉴 펼치기 ▼" : "상단 메뉴 접기 ▲";
}

function toggleHeaderPanel() {
  const panel = document.getElementById("header-collapsible");
  const nextState = !panel.classList.contains("is-collapsed");
  localStorage.setItem(STORAGE_HEADER_COLLAPSED, String(nextState));
  applyHeaderCollapseState(nextState);
}

applyHeaderCollapseState(localStorage.getItem(STORAGE_HEADER_COLLAPSED) === "true");

renderCard();
}

function jumpToIndex(idx) {
  currentIndex = Number(idx);
  renderCard();
}

function moveCard(delta) {
  const list = getFilteredList();
  if (list.length === 0) return;
  const next = currentIndex + delta;
  if (next >= 0 && next < list.length) {
    currentIndex = next;
    renderCard();
  }
}

function selectOption(qId, optNum) {
  const q = questions.find(item => item.id === qId);
  if (!q) return;

  userAnswers[qId] = optNum;
  if (optNum !== q.ans) {
    wrongSet.add(qId);
  }
  saveState();
  renderCard();
}

function removeFromWrongNote(qId) {
  wrongSet.delete(qId);
  saveState();
  const list = getFilteredList();
  if (currentIndex >= list.length) {
    currentIndex = Math.max(0, list.length - 1);
  }
  renderCard();
}

function retryCurrentQuestion() {
  const list = getFilteredList();
  const q = list[currentIndex];
  if (!q) return;
  delete userAnswers[q.id];
  saveState();
  renderCard();
}

function updateHeaderStats() {
  const solvedCount = Object.keys(userAnswers).length;
  document.getElementById("progress-fill").style.width = `${solvedCount}%`;
  document.getElementById("progress-label").innerText = `풀이 완료 ${solvedCount} / 100문항`;
  document.getElementById("wrong-count").innerText = wrongSet.size;

  const list = getFilteredList();
  const jumpSelect = document.getElementById("jump-select");
  if (list.length === 0) {
    jumpSelect.innerHTML = `<option value="0">문항 없음</option>`;
    jumpSelect.disabled = true;
  } else {
    jumpSelect.disabled = false;
    jumpSelect.innerHTML = list.map((item, idx) => {
      const done = userAnswers[item.id] !== undefined;
      const mark = done ? (userAnswers[item.id] === item.ans ? " ✔" : " ✘") : "";
      return `<option value="${idx}" ${idx === currentIndex ? "selected" : ""}>${String(item.id).padStart(2, "0")}번 문항${mark}</option>`;
    }).join("");
  }
}

function renderCard() {
  updateHeaderStats();
  const mount = document.getElementById("card-mount");
  const footer = document.getElementById("card-footer");
  const list = getFilteredList();

  if (list.length === 0) {
    footer.style.display = "none";
    mount.innerHTML = `
      <div class="flashcard empty-state">
        <h3>오답노트에 남아있는 문제가 없습니다!</h3>
        <p>틀렸던 문제를 모두 복습 완료하셨거나 아직 오답 기록이 없습니다.</p>
        <button class="btn-sm primary" onclick="setFilter('all')">전체 100문항으로 돌아가기</button>
      </div>
    `;
    return;
  }

  footer.style.display = "flex";
  if (currentIndex >= list.length) currentIndex = list.length - 1;
  const q = list[currentIndex];
  const chosen = userAnswers[q.id];
  const isAnswered = chosen !== undefined;
  const isCorrect = isAnswered && chosen === q.ans;

  let cardStateClass = "";
  if (isAnswered) {
    cardStateClass = isCorrect ? "state-correct" : "state-wrong";
  }

  const boxHtml = q.box ? `<div class="q-box">${q.box}</div>` : "";

  const optsHtml = q.opts.map((optText, idx) => {
    const optNum = idx + 1;
    let btnClass = "opt-btn";
    if (isAnswered) {
      btnClass += " locked";
      if (optNum === q.ans) btnClass += " correct-choice";
      else if (optNum === chosen) btnClass += " wrong-choice";
    }
    return `
      <button class="${btnClass}" onclick="selectOption(${q.id}, ${optNum})">
        <span class="opt-num">${optNum}</span>
        <span>${optText}</span>
      </button>
    `;
  }).join("");

  const circleNums = ["①", "②", "③", "④"];
  const verdictHtml = isCorrect
    ? `<span class="exp-verdict ok">✔ 정답입니다! (정답: ${circleNums[q.ans - 1]})</span>`
    : `<span class="exp-verdict no">✘ 오답입니다. (선택: ${isAnswered ? circleNums[chosen - 1] : "-"} / 정답: ${circleNums[q.ans - 1]})</span>`;

  const masteredBtnHtml = (wrongSet.has(q.id) && isAnswered)
    ? `<button class="btn-mastered" onclick="removeFromWrongNote(${q.id})">✓ 복습 완료 (오답에서 제외)</button>`
    : "";

  mount.innerHTML = `
    <article class="flashcard ${cardStateClass}">
      <div class="card-meta">
        <span class="subj-tag">${subjMap[q.subj]}</span>
        <span class="q-counter">문제 ${String(q.id).padStart(2, "0")}번 &nbsp;(${currentIndex + 1} / ${list.length})</span>
      </div>

      <h2 class="q-text">${String(q.id).padStart(2, "0")}. ${q.q}</h2>
      ${boxHtml}

      <div class="options-list">
        ${optsHtml}
      </div>

      <div class="explanation-drawer ${isAnswered ? "open" : ""}">
        <div class="exp-inner ${isAnswered && !isCorrect ? "is-wrong" : ""}">
          <div class="exp-status">
            ${verdictHtml}
            ${masteredBtnHtml}
          </div>
          <div class="exp-body">${q.exp}</div>
        </div>
      </div>
    </article>
  `;

  document.getElementById("btn-prev").disabled = currentIndex === 0;
  document.getElementById("btn-next").disabled = currentIndex === list.length - 1;
  document.getElementById("btn-retry-single").style.display = isAnswered ? "inline-block" : "none";
}

function showScoreSummary() {
  let s1 = 0, s2 = 0, s3 = 0;
  questions.forEach(q => {
    if (userAnswers[q.id] === q.ans) {
      if (q.subj === 1) s1++;
      else if (q.subj === 2) s2++;
      else if (q.subj === 3) s3++;
    }
  });
  const total = s1 + s2 + s3;
  const p1 = Math.round((s1 / 60) * 100);
  const p2 = Math.round((s2 / 25) * 100);
  const p3 = Math.round((s3 / 15) * 100);
  const isPass = total >= 60 && p1 >= 40 && p2 >= 40 && p3 >= 40;

  const panel = document.getElementById("score-panel");
  panel.classList.add("show");
  document.getElementById("score-title").innerHTML = isPass
    ? `합격 기준 충족! 현재 <span class="pass-txt">${total}점 / 100점</span>`
    : `현재 점수 <span class="fail-txt">${total}점 / 100점</span> (합격: 총점 60점 이상 & 과목별 40% 이상)`;

  document.getElementById("score-grid").innerHTML = `
    <div class="score-item">
      <span>총점 (합격선 60점)</span>
      <strong class="${total >= 60 ? "pass-txt" : "fail-txt"}">${total}점 / 100점</strong>
    </div>
    <div class="score-item">
      <span>1과목 펀드일반 (과락 24개)</span>
      <strong class="${p1 >= 40 ? "pass-txt" : "fail-txt"}">${s1} / 60 (${p1}%)</strong>
    </div>
    <div class="score-item">
      <span>2과목 파생상품 (과락 10개)</span>
      <strong class="${p2 >= 40 ? "pass-txt" : "fail-txt"}">${s2} / 25 (${p2}%)</strong>
    </div>
    <div class="score-item">
      <span>3과목 부동산펀드 (과락 6개)</span>
      <strong class="${p3 >= 40 ? "pass-txt" : "fail-txt"}">${s3} / 15 (${p3}%)</strong>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetAllData() {
  if (!confirm("지금까지 푼 답안 기록과 오답노트를 모두 초기화할까요?")) return;
  userAnswers = {};
  wrongSet.clear();
  saveState();
  document.getElementById("score-panel").classList.remove("show");
  setFilter("all");
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const list = getFilteredList();
  if (list.length === 0) return;

  if (["1", "2", "3", "4"].includes(e.key)) {
    const q = list[currentIndex];
    selectOption(q.id, Number(e.key));
  } else if (e.key === "ArrowLeft") {
    moveCard(-1);
  } else if (e.key === "ArrowRight") {
    moveCard(1);
  }
});

renderCard();
</script>
</body>
</html>
